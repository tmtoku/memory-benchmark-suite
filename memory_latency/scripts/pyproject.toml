[project]
name = "memory-latency-scripts"
version = "0.1.0"
description = "Memory Latency Benchmark Analysis Scripts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "T20", "FBT", "N803", "N806", "ANN401", "COM812", "ISC001", "PLR0913", "PLR0915"]

[tool.ruff.format]
quote-style = "double"
